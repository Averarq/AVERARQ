<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Proyecto · Averarq</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --naranja:#FC4C02; --ink:#212322; --grafito2:#2b2d2c; --grafito3:#343634;
    --crema:#EEEEEC; --neutro:#c7c9c7; --gris:#8a8c8a; --verde:#3fae6a; --rojo:#e8482c;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--ink); color:var(--crema); font-family:'Work Sans',sans-serif; min-height:100vh; }
  a{ color:inherit; }

  /* Topbar */
  .top{ display:flex; align-items:center; gap:12px; padding:18px 24px; border-bottom:1px solid var(--grafito3); }
  .top img{ height:30px; }
  .top .brand{ font-family:'Outfit'; font-weight:800; font-size:19px; letter-spacing:1px; }
  .top .brand span{ color:var(--naranja); }
  .top-home{ margin-left:auto; font-size:13px; color:var(--neutro); text-decoration:none; padding:7px 14px; border:1px solid var(--grafito3); border-radius:8px; transition:border-color .15s, color .15s; }
  .top-home:hover{ border-color:var(--naranja); color:var(--naranja); }

  .wrap{ max-width:920px; margin:0 auto; padding:32px 20px 60px; }

  /* Login */
  .login{ max-width:420px; margin:8vh auto; text-align:center; }
  .login .ico{ font-size:34px; margin-bottom:10px; }
  .login h1{ font-family:'Outfit'; font-size:24px; font-weight:800; margin-bottom:8px; }
  .login h1 span{ color:var(--naranja); }
  .login p{ color:var(--neutro); font-size:14px; margin-bottom:26px; line-height:1.5; }
  .login input{
    width:100%; padding:15px 18px; border-radius:10px; border:1px solid var(--grafito3);
    background:var(--grafito2); color:var(--crema); font-size:20px; text-align:center;
    font-family:'Outfit'; font-weight:700; letter-spacing:4px; text-transform:uppercase; margin-bottom:12px;
  }
  .login input::placeholder{ letter-spacing:2px; font-weight:400; color:var(--gris); }
  .login input:focus{ outline:none; border-color:var(--naranja); box-shadow:0 0 0 2px rgba(252,76,2,.2); }
  .btn{
    width:100%; padding:15px; border-radius:10px; border:none; background:var(--naranja);
    color:#fff; font-size:16px; font-weight:700; cursor:pointer; font-family:'Outfit'; transition:background .15s;
  }
  .btn:hover{ background:#ff5c14; }
  .login .err{ color:#e8916b; font-size:13px; margin-top:14px; min-height:18px; }

  /* Panel */
  .hidden{ display:none; }
  .proj-hero{ background:linear-gradient(135deg,var(--grafito2),var(--grafito3)); border-radius:16px; padding:26px 28px; margin-bottom:22px; border:1px solid var(--grafito3); }
  .proj-hero .eyebrow{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--naranja); font-weight:600; }
  .proj-hero h1{ font-family:'Outfit'; font-size:27px; font-weight:800; margin:6px 0 3px; }
  .proj-hero .estado{ color:var(--neutro); font-size:15px; }

  /* Barra avance */
  .avance-box{ margin-top:22px; }
  .avance-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .avance-top .lbl{ font-size:13px; color:var(--neutro); }
  .avance-top .pct{ font-family:'Outfit'; font-size:32px; font-weight:800; color:var(--naranja); line-height:1; }
  .avance-top .pct.full{ color:var(--verde); }
  .bar{ height:12px; background:var(--ink); border-radius:8px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--naranja); border-radius:8px; transition:width .6s cubic-bezier(.2,.9,.3,1); }
  .bar-fill.full{ background:var(--verde); }
  .avance-detalle{ display:flex; gap:20px; margin-top:12px; font-size:12px; color:var(--gris); }
  .avance-detalle b{ color:var(--crema); }

  /* Secciones */
  .seccion{ background:var(--grafito2); border-radius:14px; padding:22px 24px; margin-bottom:18px; border:1px solid var(--grafito3); }
  .seccion h2{ font-family:'Outfit'; font-size:16px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:9px; }

  /* Expediente */
  .exp-cols{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media(max-width:600px){ .exp-cols{ grid-template-columns:1fr; gap:16px; } }
  .exp-col h3{ font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--gris); margin-bottom:10px; font-weight:600; }
  .exp-row{ display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13.5px; border-bottom:1px solid rgba(255,255,255,.04); }
  .exp-ic{ width:18px; height:18px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .exp-ic.ok{ background:rgba(63,174,106,.2); color:var(--verde); }
  .exp-ic.pend{ background:var(--grafito3); color:var(--gris); }
  .exp-ic.na{ background:transparent; color:var(--gris); border:1px dashed var(--gris); font-size:9px; }
  .exp-row.na .exp-txt{ color:var(--gris); }
  .exp-row.ok .exp-txt{ color:var(--crema); }
  .exp-txt{ color:var(--neutro); }

  /* Documentos */
  .doc-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .doc-folder{ margin-bottom:12px; }
  .doc-folder-head{ display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--ink); border-radius:10px; border:1px solid var(--grafito3); transition:border-color .12s; }
  .doc-folder-head:hover{ border-color:var(--naranja); }
  .df-toggle{ display:flex; align-items:center; gap:10px; flex:1; cursor:pointer; user-select:none; min-width:0; }
  .df-arrow{ color:var(--naranja); font-size:12px; width:12px; }
  .df-ico{ font-size:16px; }
  .df-name{ font-weight:700; font-size:14px; }
  .df-count{ font-size:11px; font-weight:700; color:var(--neutro); background:var(--grafito2); padding:2px 10px; border-radius:20px; }
  .df-dlall{ background:transparent; border:1px solid var(--naranja); color:var(--naranja); font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:7px; cursor:pointer; flex-shrink:0; transition:background .12s, color .12s; }
  .df-dlall:hover{ background:var(--naranja); color:#fff; }
  .df-dlall:disabled{ opacity:.7; cursor:default; }
  .doc-folder-body{ padding:12px 2px 4px; }
  .doc-card{ background:var(--ink); border-radius:11px; padding:15px; border:1px solid var(--grafito3); display:flex; flex-direction:column; gap:9px; transition:border-color .15s; }
  .doc-card:hover{ border-color:var(--naranja); }
  .doc-ico{ font-size:22px; }
  .doc-nombre{ font-size:13.5px; font-weight:600; line-height:1.3; word-break:break-word; }
  .doc-meta{ font-size:11px; color:var(--gris); }
  .doc-cat{ display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; background:rgba(252,76,2,.15); color:var(--naranja); padding:2px 7px; border-radius:20px; }
  .doc-dl{ margin-top:auto; background:var(--naranja); color:#fff; border:none; border-radius:8px; padding:9px; font-size:12.5px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none; }
  .doc-dl:hover{ background:#ff5c14; }
  .vacio{ color:var(--gris); font-size:13px; text-align:center; padding:20px; }

  /* Pagos */
  .pago-resumen{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  @media(max-width:600px){ .pago-resumen{ grid-template-columns:1fr; } }
  .pago-stat{ background:var(--ink); border-radius:11px; padding:15px; text-align:center; }
  .pago-stat .n{ font-family:'Outfit'; font-size:21px; font-weight:800; }
  .pago-stat .n.verde{ color:var(--verde); } .pago-stat .n.rojo{ color:var(--rojo); }
  .pago-stat .l{ font-size:11px; color:var(--gris); text-transform:uppercase; letter-spacing:.5px; margin-top:3px; }
  .pago-item{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:13.5px; }
  .pago-item .pm{ font-size:16px; } .pago-item .pmonto{ font-weight:700; } .pago-item .pfecha{ margin-left:auto; color:var(--gris); font-size:12px; }
  .cf-titulo{ font-family:'Outfit'; font-size:14px; font-weight:700; margin:20px 0 10px; color:var(--neutro); }
  .cuota-fut{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:13.5px; border-left:3px solid var(--naranja); padding-left:12px; border-radius:0 6px 6px 0; }
  .cuota-fut.venc{ border-left-color:var(--rojo); }
  .cf-ico{ font-size:15px; } .cf-monto{ font-weight:700; }
  .cf-rel{ margin-left:auto; color:var(--naranja); font-size:12px; font-weight:600; }
  .cf-rel.venc{ color:var(--rojo); }

  footer{ text-align:center; padding:30px 20px; color:var(--gris); font-size:12px; border-top:1px solid var(--grafito3); margin-top:20px; }
  footer a{ color:var(--naranja); text-decoration:none; }
  .loading{ text-align:center; padding:40px; color:var(--gris); }
</style>
</head>

  <!-- LOGIN -->
  <div class="wrap" id="loginView">
    <div class="login">
      <div class="ico">🔑</div>
      <h1>Sigue tu <span>proyecto</span></h1>
      <p>Ingresa el código que te entregó tu arquitecto para ver el avance, los documentos y el estado de tu proyecto.</p>
      <input id="codigo" placeholder="AVQ-XXXX" maxlength="8" autocomplete="off">
      <button class="btn" onclick="entrar()">Ver mi proyecto</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <!-- PANEL -->
  <div class="wrap hidden" id="panelView"></div>

  <footer>
    Averarq · Arquitectura · Valle del Aconcagua · <a href="https://averarq.cl">averarq.cl</a>
  </footer>

<script>
  // CONFIG: la URL del backend
  const API = "https://averarq-backend.ai-veradonoso.workers.dev";

  const $ = s => document.querySelector(s);
  function money(n){ return "$ " + Number(n||0).toLocaleString("es-CL"); }

  // permite entrar directo con ?c=CODIGO
  const params = new URLSearchParams(location.search);
  if(params.get("c")){ $("#codigo").value = params.get("c").toUpperCase(); }

  $("#codigo").addEventListener("keydown", e=>{ if(e.key==="Enter") entrar(); });
  $("#codigo").addEventListener("input", e=>{ e.target.value = e.target.value.toUpperCase(); });

  async function entrar(){
    const cod = $("#codigo").value.trim().toUpperCase();
    const err = $("#err");
    err.textContent = "";
    if(!cod){ err.textContent = "Ingresa tu código."; return; }
    err.textContent = "Buscando tu proyecto...";
    try{
      const r = await fetch(API + "/api/seguimiento/" + encodeURIComponent(cod));
      if(!r.ok){
        const info = await r.json().catch(()=>null);
        throw new Error(info && info.error ? info.error : "No se pudo acceder.");
      }
      const data = await r.json();
      render(data.proyecto, cod);
    }catch(e){
      err.textContent = e.message;
    }
  }

  function render(p, cod){
    $("#loginView").classList.add("hidden");
    const v = $("#panelView");
    v.classList.remove("hidden");

    const a = p.avance || {pct:0};
    const full = a.pct >= 100;

    // Expediente
    const docsRows = (p.expediente && p.expediente.docs || []).map(d=>rowExp(d.label, d.estado)).join("");
    const planosRows = (p.expediente && p.expediente.planos)
      ? p.expediente.planos.map(s=>rowExp(s.label, s.estado)).join("")
      : '<div class="vacio" style="text-align:left;padding:6px 0">Aún no definido</div>';

    // Documentos agrupados por categoría (carpetas plegables)
    let docsHtml;
    if((p.documentos||[]).length){
      // Ordenar según lo definido en el organizador
      const orden = p.docOrden || 'nombre-asc';
      const ordenarDocs = (arr)=>{
        const a = arr.slice();
        a.sort((x,y)=>{
          if(orden==='nombre-asc')  return (x.nombre||'').localeCompare(y.nombre||'', 'es', {numeric:true});
          if(orden==='nombre-desc') return (y.nombre||'').localeCompare(x.nombre||'', 'es', {numeric:true});
          if(orden==='fecha-desc')  return (y.fecha||'').localeCompare(x.fecha||'');
          if(orden==='fecha-asc')   return (x.fecha||'').localeCompare(y.fecha||'');
          return 0;
        });
        return a;
      };
      const grupos = {};
      p.documentos.forEach(d=>{
        const cat = d.categoria || 'Otros';
        if(!grupos[cat]) grupos[cat] = [];
        grupos[cat].push(d);
      });
      const cats = Object.keys(grupos).sort((a,b)=>{
        if(a==='Otros') return 1; if(b==='Otros') return -1; return a.localeCompare(b);
      });
      docsHtml = cats.map(cat=>{
        const docsOrd = ordenarDocs(grupos[cat]);
        const cards = docsOrd.map(d=>docCard(d, cod)).join("");
        const ids = docsOrd.map(d=>d.id).join(',');
        return '<div class="doc-folder open">'+
          '<div class="doc-folder-head">'+
            '<span class="df-toggle" onclick="toggleFolder(this)"><span class="df-arrow">▾</span><span class="df-ico">📁</span>'+
            '<span class="df-name">'+esc(cat)+'</span>'+
            '<span class="df-count">'+grupos[cat].length+'</span></span>'+
            '<button class="df-dlall" onclick="descargarCategoria(\''+ids+'\',\''+cod+'\',this)">⬇ Descargar todas</button>'+
          '</div>'+
          '<div class="doc-folder-body"><div class="doc-grid">'+cards+'</div></div></div>';
      }).join("");
    } else {
      docsHtml = '<div class="vacio">Aún no hay documentos disponibles para descargar.</div>';
    }

    // Pagos
    const pagosHtml = (p.pagos||[]).length
      ? p.pagos.slice().reverse().map(pg=>
          '<div class="pago-item"><span class="pm">'+metodoIco(pg.metodo)+'</span>'+
          '<span class="pmonto">'+money(pg.monto)+'</span>'+
          '<span style="color:var(--gris);font-size:12px">'+(pg.metodo||"")+(pg.nota?" · "+esc(pg.nota):"")+'</span>'+
          '<span class="pfecha">'+(pg.fecha||"")+'</span></div>'
        ).join("")
      : '<div class="vacio">Aún no hay pagos registrados.</div>';

    // Cuotas futuras
    const hoyCf = new Date(); hoyCf.setHours(0,0,0,0);
    const cuotasHtml = (p.cuotasFuturas||[]).length
      ? p.cuotasFuturas.map(c=>{
          let rel='', venc=false;
          if(c.fecha){
            const f=new Date(c.fecha+'T00:00:00'); const dias=Math.round((f-hoyCf)/86400000);
            if(dias<0){ rel='Vencida'; venc=true; } else if(dias===0) rel='Vence hoy';
            else if(dias===1) rel='Mañana'; else if(dias<31) rel='En '+dias+' días';
            else rel='En '+Math.round(dias/30)+' mes(es)';
          }
          return '<div class="cuota-fut'+(venc?' venc':'')+'"><span class="cf-ico">📅</span>'+
            '<span class="cf-monto">'+money(c.monto)+'</span>'+
            '<span style="color:var(--gris);font-size:12px">'+(c.fecha||'')+(c.nota?" · "+esc(c.nota):"")+'</span>'+
            '<span class="cf-rel'+(venc?' venc':'')+'">'+rel+'</span></div>';
        }).join("")
      : '';

    v.innerHTML = `
      <div class="proj-hero">
        <div class="eyebrow">Proyecto</div>
        <h1>${esc(p.nombre)}</h1>
        <div class="estado">${esc(p.estado||"En proceso")}</div>
        <div class="avance-box">
          <div class="avance-top">
            <span class="lbl">Avance del expediente</span>
            <span class="pct ${full?'full':''}">${a.pct}%</span>
          </div>
          <div class="bar"><div class="bar-fill ${full?'full':''}" style="width:${a.pct}%"></div></div>
          <div class="avance-detalle">
            <span>Documentos: <b>${a.docsPct==null?'—':a.docsPct+'%'}</b></span>
            <span>Planos: <b>${a.planosPct==null?'—':a.planosPct+'%'}</b></span>
          </div>
        </div>
      </div>

      <div class="seccion">
        <h2>🏛 Estado del expediente</h2>
        <div class="exp-cols">
          <div class="exp-col"><h3>Documentos</h3>${docsRows}</div>
          <div class="exp-col"><h3>Conjunto planimétrico</h3>${planosRows}</div>
        </div>
      </div>

      <div class="seccion">
        <h2>📁 Documentos para descargar</h2>
        ${docsHtml}
      </div>

      <div class="seccion">
        <h2>💰 Estado de pagos</h2>
        <div class="pago-resumen">
          <div class="pago-stat"><div class="n">${money(p.total)}</div><div class="l">Total proyecto</div></div>
          <div class="pago-stat"><div class="n verde">${money(p.totalAbonado)}</div><div class="l">Abonado</div></div>
          <div class="pago-stat"><div class="n rojo">${money(p.saldo)}</div><div class="l">Saldo pendiente</div></div>
        </div>
        ${pagosHtml}
        ${cuotasHtml ? '<h3 class="cf-titulo">📅 Próximas cuotas pactadas</h3>'+cuotasHtml : ''}
      </div>
    `;
    window.scrollTo(0,0);
  }

  function rowExp(label, estado){
    const ic = estado==="ok" ? '<span class="exp-ic ok">✓</span>'
             : estado==="na" ? '<span class="exp-ic na">N/A</span>'
             : '<span class="exp-ic pend"></span>';
    return '<div class="exp-row '+estado+'">'+ic+'<span class="exp-txt">'+esc(label)+'</span></div>';
  }
  function docCard(d, cod){
    const url = API + "/api/seguimiento/" + encodeURIComponent(cod) + "/documento/" + encodeURIComponent(d.id);
    const ico = docIco(d.type, d.fileName);
    const kb = d.size ? (d.size>1048576 ? (d.size/1048576).toFixed(1)+" MB" : Math.round(d.size/1024)+" KB") : "";
    return '<div class="doc-card">'+
      '<div class="doc-ico">'+ico+'</div>'+
      (d.categoria?'<span class="doc-cat">'+esc(d.categoria)+'</span>':'')+
      '<div class="doc-nombre">'+esc(d.nombre||d.fileName)+'</div>'+
      '<div class="doc-meta">'+(d.fecha||"")+(kb?" · "+kb:"")+'</div>'+
      '<a class="doc-dl" href="'+url+'">Descargar</a></div>';
  }
  function docIco(type, name){
    const t = (type||"")+(name||"");
    if(/pdf/i.test(t)) return "📄";
    if(/(jpg|jpeg|png|webp|gif|image)/i.test(t)) return "🖼️";
    if(/(dwg|dxf|plan)/i.test(t)) return "📐";
    if(/(zip|rar)/i.test(t)) return "🗜️";
    return "📎";
  }
  function metodoIco(m){ if(/transf/i.test(m))return "🏦"; if(/efect/i.test(m))return "💵"; return "📎"; }
  function esc(s){ return String(s||"").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  window.toggleFolder = function(el){
    const folder = el.closest('.doc-folder');
    const body = folder.querySelector('.doc-folder-body');
    const arrow = folder.querySelector('.df-arrow');
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    arrow.textContent = open ? '▸' : '▾';
  };
  window.descargarCategoria = async function(idsStr, cod, btn){
    const ids = idsStr.split(',').filter(Boolean);
    if(!ids.length) return;
    const orig = btn.textContent;
    btn.disabled = true;
    let ok = 0;
    for(let i=0;i<ids.length;i++){
      btn.textContent = 'Descargando '+(i+1)+'/'+ids.length+'...';
      try{
        const url = API + "/api/seguimiento/" + encodeURIComponent(cod) + "/documento/" + encodeURIComponent(ids[i]);
        const r = await fetch(url);
        if(!r.ok) continue;
        const blob = await r.blob();
        const cd = r.headers.get('Content-Disposition') || '';
        const m = cd.match(/filename="?([^"]+)"?/);
        const name = m ? m[1] : ('documento-'+(i+1));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name; a.click();
        URL.revokeObjectURL(a.href);
        ok++;
        await new Promise(res=>setTimeout(res, 400)); // pausa entre descargas
      }catch(e){ /* seguir con las demás */ }
    }
    btn.textContent = '✓ '+ok+' descargada'+(ok!==1?'s':'');
    setTimeout(()=>{ btn.textContent = orig; btn.disabled = false; }, 2500);
  };

  // auto-entrar si viene con código en la URL
  if(params.get("c")){ entrar(); }
</script>
</body>
