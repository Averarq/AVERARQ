<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVERARQ · Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FC4C02; --ink:#212322; --grafito2:#2b2d2c; --grafito3:#343634;
    --cream:#EEEEEC; --neutro:#c7c9c7; --gris:#53565a; --rojo:#e8482c;
  }
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
  body{
    background:var(--ink); color:var(--cream); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{ width:100%; max-width:520px; }

  .brand{ display:flex; flex-direction:column; align-items:center; gap:18px; margin-bottom:44px; }
  .brand img{ height:78px; width:auto; }
  .brand-text{ font-weight:800; font-size:30px; letter-spacing:1px; }
  .brand-sub{ font-size:12px; color:var(--neutro); letter-spacing:3px; text-transform:uppercase; margin-top:-10px; }

  /* LOGIN */
  .card{ background:var(--grafito2); border-radius:18px; padding:36px 32px; }
  .card h2{ font-size:19px; margin-bottom:6px; text-align:center; }
  .card p.sub{ font-size:13px; color:var(--neutro); text-align:center; margin-bottom:24px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--neutro); margin-bottom:7px; }
  input[type=password]{
    width:100%; background:var(--ink); border:1px solid #3a3c3b; border-radius:10px; padding:13px 15px;
    color:var(--cream); font-family:'Outfit'; font-size:15px;
  }
  input[type=password]:focus{ outline:none; border-color:var(--orange); }
  button{ cursor:pointer; border:none; font-family:'Outfit'; font-weight:600; }
  .btn-primary{
    width:100%; background:var(--orange); color:var(--ink); padding:14px; border-radius:10px; font-size:15px; font-weight:700;
    transition:background .15s;
  }
  .btn-primary:hover{ background:#ff5c14; }
  .error{ color:var(--rojo); font-size:13px; margin-top:12px; text-align:center; min-height:18px; }
  .hint{ font-size:12px; color:var(--gris); text-align:center; margin-top:16px; line-height:1.5; }

  /* CHOOSER */
  .chooser{ display:none; }
  .chooser.active{ display:block; }
  .card.login.hidden{ display:none; }
  .apps{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:480px){ .apps{ grid-template-columns:1fr; } }
  .app-card{
    background:var(--grafito2); border-radius:16px; padding:30px 22px; text-align:center; cursor:pointer;
    border:1px solid transparent; transition:transform .15s, border-color .15s, background .15s; text-decoration:none; color:var(--cream);
    display:block;
  }
  .app-card:hover{ transform:translateY(-4px); border-color:var(--orange); background:var(--grafito3); }
  .app-icon{ font-size:40px; margin-bottom:14px; }
  .app-name{ font-weight:700; font-size:18px; margin-bottom:6px; }
  .app-desc{ font-size:12px; color:var(--neutro); line-height:1.5; }
  .logout{ background:none; color:var(--gris); font-size:13px; margin:24px auto 0; display:block; }
  .logout:hover{ color:var(--cream); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img id="brandLogo" alt="Averarq">
    <div>
      <div class="brand-text" style="text-align:center;">AVERARQ</div>
      <div class="brand-sub">Panel interno</div>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="card login" id="loginCard">
    <h2 id="loginTitle">Ingresar</h2>
    <p class="sub" id="loginSub">Ingresa tu contraseña para acceder.</p>
    <div class="field">
      <label id="pwLabel">Contraseña</label>
      <input type="password" id="pw" placeholder="••••••••" onkeydown="if(event.key==='Enter') submitLogin()">
    </div>
    <button class="btn-primary" id="loginBtn" onclick="submitLogin()">Entrar</button>
    <div class="error" id="loginError"></div>
    <div class="hint" id="loginHint"></div>
  </div>

  <!-- CHOOSER -->
  <div class="chooser" id="chooser">
    <div class="card">
      <h2 style="margin-bottom:22px;">¿A dónde quieres ir?</h2>
      <div class="apps">
        <a class="app-card" href="../gestor/">
          <div class="app-icon">🏗️</div>
          <div class="app-name">Gestor</div>
          <div class="app-desc">Gestión técnica de proyectos: presupuestos, honorarios, curva S, instalaciones</div>
        </a>
        <a class="app-card" href="../organizador/">
          <div class="app-icon">📊</div>
          <div class="app-name">Organizador</div>
          <div class="app-desc">Captación, seguimiento de proyectos, pagos y documentos</div>
        </a>
      </div>
      <button class="logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</div>

// Clave fija del hub (guardada como hash SHA-256, nunca en texto plano)
const PW_HASH = "7417467164c62896c28ccce1a58507721783161d66102679c6f3335fda8f3690";
const SESSION_KEY = 'averarq_hub_session';

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function initUI(){
  if(sessionStorage.getItem(SESSION_KEY)==='ok'){
    showChooser();
  }
}

async function submitLogin(){
  const err = document.getElementById('loginError');
  err.textContent = '';
  const pw = document.getElementById('pw').value;
  if(!pw){ err.textContent = 'Ingresa la contraseña.'; return; }
  const h = await sha256(pw);
  if(h === PW_HASH){
    sessionStorage.setItem(SESSION_KEY, 'ok');
    showChooser();
  } else {
    err.textContent = 'Contraseña incorrecta.';
    document.getElementById('pw').value = '';
  }
}

function showChooser(){
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('chooser').classList.add('active');
}

function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

initUI();
</script>
