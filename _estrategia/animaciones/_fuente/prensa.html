<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AVERARQ · Prensa francesa</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#111110}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script>
/*
  Animación isométrica: prensa francesa (molienda gruesa, agua, reposo y prensado), Día Internacional del Café.
  Misma línea gráfica y motor que los detalles constructivos. Unidades: milímetros. Taza con un cuarto cortado.
*/
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), g = cv.getContext('2d');
const SS = Math.max(1, +(Q.get('escala') || 1));
const W = 1080, H = Q.get('formato') === 'reel' ? 1920 : 1350, DUR = 18.5;
const REEL = H > 1500, CPY = REEL ? 285 : 0;
cv.width = W * SS; cv.height = H * SS;
const OR = '#FC4C02', CR = '#F2F0EB', BG = '#111110';
const cr = a => `rgba(242,240,235,${a})`, orA = a => `rgba(252,76,2,${a})`;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const lerp = (a, b, t) => a + (b - a) * t;

// ------------------------------------------------------------------ cámara isométrica
const cam = { s: 1.5, fx: 0, fy: 0, cx: 540, cy: 680 };
const C30 = Math.cos(Math.PI / 6);
const iso = (x, y, z) => [(x - y) * C30, (x + y) * 0.5 - z];
function P(x, y, z) { const [X, Y] = iso(x, y, z); return [cam.cx + (X - cam.fx) * cam.s, cam.cy + (Y - cam.fy) * cam.s]; }
const K = () => cam.s / 1.45;
const M = 36, TOP = 214, CAJ = REEL ? H - M - 26 - 202 : 1086, CAJ1 = H - M - 26;
// encuadre: la caja bb queda centrada en el rectángulo r = [x0, y0, x1, y1] de la pantalla
function encuadre(bb, r, pad = [0, 0]) {
  const pts = [];
  for (const x of bb.slice(0, 2)) for (const y of bb.slice(2, 4)) for (const z of bb.slice(4, 6)) pts.push(iso(x, y, z));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  return { s: Math.min((r[2] - r[0] - 2 * pad[0]) / (x1 - x0), (r[3] - r[1] - 2 * pad[1]) / (y1 - y0)),
    fx: (x0 + x1) / 2, fy: (y0 + y1) / 2, cx: (r[0] + r[2]) / 2, cy: (r[1] + r[3]) / 2 };
}
// ------------------------------------------------------------------ texturas
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function patron(w, h, dibujar) {
  const c = document.createElement('canvas'); c.width = w * SS; c.height = h * SS;
  const x = c.getContext('2d'); x.scale(SS, SS); dibujar(x, w, h); return g.createPattern(c, 'repeat');
}
const PAT = {
  hormigon: patron(90, 90, (c, w, h) => {
    const r = rng(7); c.fillStyle = cr(.35);
    for (let i = 0; i < 26; i++) { c.beginPath(); c.arc(r() * w, r() * h, .9, 0, 7); c.fill(); }
    c.strokeStyle = cr(.28); c.lineWidth = .9;
    for (let i = 0; i < 5; i++) { const x = r() * w, y = r() * h, s = 3 + r() * 2.5, a = r() * 6;
      c.beginPath(); for (let k = 0; k < 3; k++) c.lineTo(x + s * Math.cos(a + k * 2.1), y + s * Math.sin(a + k * 2.1)); c.closePath(); c.stroke(); }
  }),
  corte: patron(70, 70, (c, w, h) => {
    const r = rng(11); c.fillStyle = cr(.55);
    for (let i = 0; i < 34; i++) { c.beginPath(); c.arc(r() * w, r() * h, 1, 0, 7); c.fill(); }
    c.strokeStyle = cr(.5); c.lineWidth = 1;
    for (let i = 0; i < 9; i++) { const x = r() * w, y = r() * h, s = 3.5 + r() * 3, a = r() * 6;
      c.beginPath(); for (let k = 0; k < 3; k++) c.lineTo(x + s * Math.cos(a + k * 2.1), y + s * Math.sin(a + k * 2.1)); c.closePath(); c.stroke(); }
  }),
  tierra: patron(40, 40, (c, w, h) => {
    c.strokeStyle = cr(.22); c.lineWidth = 1;
    for (let i = -h; i < w; i += 13) { c.beginPath(); c.moveTo(i, h); c.lineTo(i + h, 0); c.stroke(); }
    const r = rng(3); c.fillStyle = cr(.25);
    for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(r() * w, r() * h, .8, 0, 7); c.fill(); }
  }),
  ripio: patron(50, 50, (c, w, h) => { // piedras redondeadas
    const r = rng(29); c.strokeStyle = cr(.42); c.lineWidth = 1;
    for (let i = 0; i < 22; i++) { const x = r() * w, y = r() * h, a = 2 + r() * 3, b = 1.5 + r() * 2;
      c.beginPath(); c.ellipse(x, y, a, b, r() * 3, 0, 7); c.stroke(); }
  }),
  eps: patron(30, 30, (c, w, h) => {
    const r = rng(23); c.strokeStyle = cr(.26); c.lineWidth = .8;
    for (let i = 0; i < 9; i++) { c.beginPath(); c.arc(r() * w, r() * h, 1.8 + r() * 1.6, 0, 7); c.stroke(); }
  }),
  lana: patron(40, 24, (c, w, h) => {
    c.strokeStyle = 'rgba(242,235,210,0.30)'; c.lineWidth = 1;
    for (let y = 6; y < h + 12; y += 12) { c.beginPath();
      for (let x = -10; x <= w + 10; x += 10) { c.moveTo(x, y); c.bezierCurveTo(x + 2, y - 7, x + 8, y - 7, x + 10, y); }
      c.stroke(); }
  }),
  film: patron(16, 16, (c, w, h) => { c.strokeStyle = 'rgba(210,230,245,0.2)'; c.lineWidth = .8;
    for (let i = -h; i < w; i += 8) { c.beginPath(); c.moveTo(i, h); c.lineTo(i + h, 0); c.stroke(); } }),
  madera: patron(60, 12, (c, w, h) => {
    c.strokeStyle = 'rgba(242,220,180,0.22)'; c.lineWidth = .9;
    for (let y = 2; y < h; y += 4) { c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(w * .3, y - 1.2, w * .6, y + 1.2, w, y); c.stroke(); }
  }),
};
function anclarPatrones() {
  const [ox, oy] = P(0, 0, 0), k = cam.s / 1.45;
  for (const p of Object.values(PAT)) p.setTransform(new DOMMatrix([k / SS, 0, 0, k / SS, ox, oy]));
}

// ------------------------------------------------------------------ primitivas de dibujo
function poli(pts, fill, stroke, lw, pat, patAlpha = 1, dash) {
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (pat) { g.save(); g.globalAlpha *= patAlpha; g.fillStyle = pat; g.fill(); g.restore(); }
  if (stroke) { g.setLineDash(dash || []); g.strokeStyle = stroke; g.lineWidth = lw; g.lineJoin = 'round'; g.stroke(); g.setLineDash([]); }
}
function linea(a, b, col, lw, dash) { g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.setLineDash(dash || []); g.stroke(); g.setLineDash([]); }
function mezcla(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, t));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
const TONO = {
  conc: { sup: '#363533', fy: '#282826', fx: '#2f2e2c', pat: 'hormigon', patA: .6, corte: '#2b2b29', patCorte: 'corte' },
  tierra: { sup: '#3a3129', fy: '#2e2720', fx: '#342c24', pat: 'tierra', patA: 1, corte: '#2e2720', patCorte: 'tierra' },
  ripio: { sup: '#4a4843', fy: '#3c3a36', fx: '#43413c', pat: 'ripio', patA: 1, corte: '#3c3a36', patCorte: 'ripio' },
  eps: { sup: '#9a9993', fy: '#84837e', fx: '#8e8d88', pat: 'eps', patA: 1, corte: '#84837e', patCorte: 'eps' },
  madera: { sup: '#8a6c45', fy: '#6e5536', fx: '#7b603e', pat: 'madera', patA: 1 },
  lana: { sup: '#8a7a4c', fy: '#766840', fx: '#807146', pat: 'lana', patA: 1, corte: '#766840', patCorte: 'lana' },
  yeso: { sup: '#9a9994', fy: '#83827d', fx: '#8e8d88', pat: null },
  zinc: { sup: '#7f8386', fy: '#65686b', fx: '#717477', pat: null },
  fieltro: { sup: '#2a2927', fy: '#222120', fx: '#262523', pat: null },
  pvc: { sup: '#a3a19b', fy: '#86847f', fx: '#96948e', pat: null },
  tapa: { sup: '#55534f', fy: '#403f3c', fx: '#4a4845', pat: 'hormigon', patA: .5 },
};
// caja con sus tres caras visibles; o.h = resaltado (0–1), o.corte = caras que son corte ('fx', 'fy'), o.a = opacidad
function caja(b, tipo, o = {}) {
  const [x0, x1, y0, y1, z0, z1] = b, k = K(), h = o.h || 0, tn = TONO[tipo];
  const c = {
    sup: [P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)],
    fy: [P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)],
    fx: [P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)],
  };
  g.save(); if (o.a != null) g.globalAlpha *= o.a;
  if (tipo === 'film') {
    const trazo = h > 0 ? mezcla('#F2F0EB', OR, h) : cr(.75);
    for (const f of ['sup', 'fy', 'fx']) poli(c[f], `rgba(190,215,235,${0.16 + 0.12 * h})`, trazo, 1 * k, PAT.film, 1, f === 'sup' ? null : [6 * k, 4 * k]);
    g.restore(); return;
  }
  const trazo = h > 0 ? mezcla('#F2F0EB', OR, h) : cr(o.tenue ? .5 : .85);
  const tinte = f => h > 0 ? mezcla(f, '#6e2a0c', .45 * h) : f;
  const pat = tn.pat && PAT[tn.pat], corte = o.corte || [];
  for (const f of ['sup', 'fy', 'fx']) {
    if (o.sin && o.sin.includes(f)) continue;
    if (corte.includes(f)) poli(c[f], tinte(tn.corte || tn[f]), h > 0 ? trazo : CR, 1.6 * k, PAT[tn.patCorte || tn.pat]);
    else poli(c[f], tinte(tn[f]), trazo, 1.25 * k, pat, tn.patA);
  }
  g.restore();
}
// pieza prismática: polígono en el plano xz extruido entre y0 e y1 (cerchas, piezas inclinadas)
function prisma(pts, y0, y1, tipo, o = {}) {
  const k = K(), h = o.h || 0, tn = TONO[tipo];
  const trazo = h > 0 ? mezcla('#F2F0EB', OR, h) : cr(.85), tinte = f => h > 0 ? mezcla(f, '#6e2a0c', .45 * h) : f;
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cz = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  pts.forEach((a, i) => {
    const b = pts[(i + 1) % pts.length];
    let nx = b[1] - a[1], nz = -(b[0] - a[0]);
    const mx = (a[0] + b[0]) / 2 - cx, mz = (a[1] + b[1]) / 2 - cz;
    if (nx * mx + nz * mz < 0) { nx = -nx; nz = -nz; }
    if (nx + nz <= 0) return;
    poli([P(a[0], y0, a[1]), P(b[0], y0, b[1]), P(b[0], y1, b[1]), P(a[0], y1, a[1])], tinte(nz > Math.abs(nx) ? tn.sup : tn.fx), trazo, 1.25 * k, PAT[tn.pat], tn.patA);
  });
  poli(pts.map(p => P(p[0], y1, p[1])), tinte(tn.fy), trazo, 1.25 * k, PAT[tn.pat], tn.patA);
}
const barra = (a, b, w) => { // rectángulo de ancho w a lo largo del segmento a-b (plano xz)
  const dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz), nx = -dz / l * w / 2, nz = dx / l * w / 2;
  return [[a[0] + nx, a[1] + nz], [b[0] + nx, b[1] + nz], [b[0] - nx, b[1] - nz], [a[0] - nx, a[1] - nz]];
};
// capa delgada que sigue un faldón: z = zf(x) entre xa y xb, espesor e
function faldon(xa, xb, y0, y1, zf, e, tipo, o = {}) {
  const k = K(), h = o.h || 0, tn = TONO[tipo];
  const trazo = h > 0 ? mezcla('#F2F0EB', OR, h) : cr(.85), tinte = f => h > 0 ? mezcla(f, '#6e2a0c', .45 * h) : f;
  const A = zf(xa), B = zf(xb);
  poli([P(xa, y1, A), P(xb, y1, B), P(xb, y1, B + e), P(xa, y1, A + e)], tinte(tn.fy), trazo, 1.1 * k);
  if (B < A) poli([P(xb, y0, B), P(xb, y1, B), P(xb, y1, B + e), P(xb, y0, B + e)], tinte(tn.fx), trazo, 1.1 * k);
  poli([P(xa, y0, A + e), P(xb, y0, B + e), P(xb, y1, B + e), P(xa, y1, A + e)], tinte(tn.sup), trazo, 1.25 * k, tn.pat && PAT[tn.pat], tn.patA);
  if (o.onda) { // ondas del zinc, en el sentido de la pendiente
    for (let y = y0 + o.onda; y < y1 - 1; y += o.onda) linea(P(xa, y, A + e), P(xb, y, B + e), h > 0 ? orA(.5) : cr(.3), 1 * k);
  }
}
function flecha(pts3, col, lw, dash) { // polilínea 3D con punta
  const k = K(), pp = pts3.map(p => P(...p));
  g.save(); g.beginPath(); pp.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p));
  g.strokeStyle = col; g.lineWidth = lw * k; g.setLineDash(dash ? dash.map(d => d * k) : []); g.lineCap = 'round'; g.stroke(); g.setLineDash([]);
  const [a, b] = pp.slice(-2), ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = 12 * k;
  g.beginPath(); g.moveTo(...b); g.lineTo(b[0] - L * Math.cos(ang - .45), b[1] - L * Math.sin(ang - .45));
  g.lineTo(b[0] - L * Math.cos(ang + .45), b[1] - L * Math.sin(ang + .45)); g.closePath(); g.fillStyle = col; g.fill();
  g.restore();
}

// ------------------------------------------------------------------ rótulos
function nivel(p, txt, largo = 80) {
  const k = Math.max(.85, K()); const [x, y] = P(...p); const x2 = x - 26 * k;
  linea([x - 4 * k, y], [x2 - largo * k, y], cr(.7), 1 * k);
  g.beginPath(); g.moveTo(x2 + 4 * k, y - 11 * k); g.lineTo(x2 + 16 * k, y - 11 * k); g.lineTo(x2 + 10 * k, y); g.closePath();
  g.fillStyle = CR; g.fill();
  g.font = `500 ${15 * k}px "IBM Plex Mono"`; g.fillStyle = CR; g.textBaseline = 'bottom'; g.textAlign = 'right';
  g.fillText(txt, x2, y - 1 * k); g.textAlign = 'left';
}
function cota(p1, p2, txt, off = [0, 18]) {
  const k = Math.max(.85, K()), [ox, oy] = [off[0] * k, off[1] * k];
  const A = [p1[0] + ox, p1[1] + oy], B = [p2[0] + ox, p2[1] + oy];
  linea(p1, A, cr(.35), .8 * k); linea(p2, B, cr(.35), .8 * k);
  linea(A, B, cr(.8), 1 * k);
  for (const Q of [A, B]) linea([Q[0] - 4 * k, Q[1] + 4 * k], [Q[0] + 4 * k, Q[1] - 4 * k], CR, 1.6 * k);
  g.font = `500 ${14 * k}px "IBM Plex Mono"`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const m = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
  g.fillStyle = BG; const w = g.measureText(txt).width + 8 * k; g.fillRect(m[0] - w / 2, m[1] - 9 * k, w, 18 * k);
  g.fillStyle = CR; g.fillText(txt, m[0], m[1] + 1);
  g.textAlign = 'left';
}
function etiqueta(n, p, d, act) {
  const k = Math.max(.8, K()), [x, y] = P(...p), X = x + d[0] * k, Y = y + d[1] * k;
  g.beginPath(); g.arc(x, y, 3.2 * k, 0, 7); g.fillStyle = act ? OR : CR; g.fill();
  linea([x, y], [X, Y], act ? OR : cr(.8), 1.2 * k);
  const r = 15 * k;
  g.beginPath(); g.arc(X, Y, r, 0, 7); g.fillStyle = act ? OR : BG; g.fill();
  g.strokeStyle = act ? OR : CR; g.lineWidth = 1.4 * k; g.stroke();
  g.fillStyle = act ? '#fff' : CR; g.font = `700 ${17 * k}px "Barlow Condensed"`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(n), X, Y + 1); g.textAlign = 'left';
}
function rotulo(txt, p, d, act) { // texto con recuadro y guía
  const k = Math.max(.8, K()), [x, y] = P(...p), X = x + d[0] * k, Y = y + d[1] * k;
  linea([x, y], [X, Y], act ? OR : cr(.7), 1 * k);
  g.font = `500 ${13 * k}px "IBM Plex Mono"`; const w = g.measureText(txt).width + 14 * k;
  g.fillStyle = BG; g.fillRect(X - w / 2, Y - 12 * k, w, 24 * k);
  g.strokeStyle = act ? OR : cr(.7); g.lineWidth = 1 * k; g.strokeRect(X - w / 2, Y - 12 * k, w, 24 * k);
  g.fillStyle = act ? OR : CR; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, X, Y + 1); g.textAlign = 'left';
}

// ------------------------------------------------------------------ guion
const ET = [
  null,
  { n: '01', t0: 0.9, t1: 3.2, tit: 'Café molido grueso', txt: 'Molienda gruesa al fondo de la jarra: la malla la retiene sin obstruirse.', spec: '30 g · MOLIENDA GRUESA' },
  { n: '02', t0: 3.2, t1: 6.4, tit: 'Agua caliente', txt: 'Se vierte toda el agua; el café sube y forma una costra en la superficie.', spec: '500 ml · 93 °C · 1:16' },
  { n: '03', t0: 6.4, t1: 9.6, tit: 'Reposo', txt: 'Tapa puesta y émbolo arriba: inmersión total mientras corre el tiempo.', spec: '4 MINUTOS DE INFUSIÓN' },
  { n: '04', t0: 9.6, t1: 12.8, tit: 'Prensado', txt: 'El émbolo baja lento y parejo: la malla separa el café del líquido.', spec: 'PRESIÓN LENTA Y PAREJA' },
];
const N = ET.length - 1, T_RES = 13.2, T_CP = 15.8;
const hl = e => t => t < ET[e].t0 ? 0 : t < ET[e].t1 ? 1 : 1 - clamp((t - ET[e].t1) / 0.9);

// ------------------------------------------------------------------ geometría (mm): prensa francesa de vidrio con estructura metálica
const RJ = 46, HJ = 150, ZL = 150, VAR = 150;                                        // jarra, tapa, largo de la varilla
const rj = () => RJ, rin = () => RJ - 3;
const BB = [-150, 70, -80, 80, -6, ZL + VAR + 40];
const A = r => 1.2247 * r * cam.s, Bv = r => 0.7071 * r * cam.s;
const C = z => P(0, 0, z);
const hex = c => c.startsWith('#') ? c : '#' + c.match(/\d+/g).map(v => (+v).toString(16).padStart(2, '0')).join('');
function elipse(z, r, a0 = 0, a1 = Math.PI * 2) { const [cx, cy] = C(z); const p = []; for (let i = 0; i <= 48; i++) { const a = a0 + (a1 - a0) * i / 48; p.push([cx + A(r) * Math.cos(a), cy + Bv(r) * Math.sin(a)]); } return p; }
function silueta(rfun, z0, z1, n = 20) {
  const der = [], izq = [];
  for (let i = 0; i <= n; i++) { const z = z0 + (z1 - z0) * i / n, [cx, cy] = C(z), r = rfun(z); der.push([cx + A(r), cy]); izq.push([cx - A(r), cy]); }
  return [...der, ...elipse(z1, rfun(z1), 0, -Math.PI), ...izq.reverse(), ...elipse(z0, rfun(z0), Math.PI, 0)];
}
function cilindroMetal(r, z0, z1, h, k, tono = '#7d8186') {
  poli(silueta(() => r, z0, z1), tono, h > 0 ? mezcla('#F2F0EB', OR, h) : CR, 1.3 * k);
  poli(elipse(z1, r), mezcla(tono, '#ffffff', .15), h > 0 ? mezcla('#F2F0EB', OR, h) : CR, 1.2 * k);
}
let CAM_FIJA = null, ROT = true;
function camara(t) {
  if (CAM_FIJA) { Object.assign(cam, CAM_FIJA); return; }
  Object.assign(cam, encuadre(BB, [M, TOP, W - M, CAJ], REEL ? [40, 30] : [90, 20]));
  cam.s *= REEL ? 1.0 : 0.95; cam.cx += REEL ? 40 : 30;
}

// ------------------------------------------------------------------ escena
function escena(t) {
  camara(t); anclarPatrones();
  const h = e => hl(e)(t), k = K(), tr = e => h(e) > 0 ? mezcla('#F2F0EB', OR, h(e)) : CR;
  const pa = easeOut((t - ET[1].t0 + 0.6) / 1.0);
  if (pa <= 0) return;
  const pg = ease((t - ET[1].t0 - 0.2) / 1.6);                                      // café al fondo
  const pw = ease((t - ET[2].t0 - 0.2) / 2.6);                                      // agua
  const pt = easeOut((t - ET[3].t0 - 0.1) / 0.9);                                   // tapa y émbolo
  const pp = ease((t - ET[4].t0 - 0.2) / 2.6);                                      // prensado
  const zW = 4 + 118 * pw, zG = 4 + 12 * pg;
  const zM = lerp(ZL - 12, 22, pp);                                                  // malla del émbolo
  cilindroMetal(RJ + 3, -6, 4, 0, k);                                               // base metálica
  // contenido
  if (pg > 0 && pw <= 0) {
    poli(silueta(rin, 4, zG), mezcla('#3b2a1c', OR, .35 * h(1)), null, 0);
    poli(elipse(zG, rin()), mezcla('#4a3424', OR, .35 * h(1)), cr(.35), .8 * k);
  }
  if (pw > 0) {
    const zSup = zW;
    if (pp > 0) { // bajo la malla: café atrapado; sobre la malla: café filtrado
      poli(silueta(rin, 4, Math.min(zM, zSup)), '#2a1a10', null, 0);
      const r0 = rng(3); g.fillStyle = 'rgba(200,160,110,0.30)';
      for (let i = 0; i < 80; i++) { const z = 4 + r0() * (Math.min(zM, zSup) - 4), a = r0() * 7, rr = Math.sqrt(r0()) * rin() * .95, [cx, cy] = C(z); g.beginPath(); g.arc(cx + A(rr) * Math.cos(a) * .9, cy + Bv(rr) * Math.sin(a) * .4, .9 * k, 0, 7); g.fill(); }
      if (zSup > zM) poli(silueta(rin, zM, zSup), mezcla('#3a2416', OR, .3 * h(4)), null, 0);
    } else poli(silueta(rin, 4, zSup), mezcla('#3a2416', OR, .3 * h(2)), null, 0);
    // costra de café en la superficie (se deshace al prensar)
    const costra = pw * (1 - pp);
    poli(elipse(zSup, rin()), mezcla(costra > .3 ? '#5a3e26' : '#4a2e1b', OR, .3 * (h(2) + h(3))), cr(.35), .8 * k);
    if (costra > .05) { const r1 = rng(7); g.fillStyle = `rgba(210,170,120,${.45 * costra})`;
      for (let i = 0; i < 60; i++) { const a = r1() * 7, rr = Math.sqrt(r1()) * rin() * .92, [cx, cy] = C(zSup); g.beginPath(); g.arc(cx + A(rr) * Math.cos(a), cy + Bv(rr) * Math.sin(a), 1 * k, 0, 7); g.fill(); } }
  }
  // granos cayendo
  if (t > ET[1].t0 && t < ET[1].t1) for (let i = 0; i < 16; i++) { const f = (t * 1.2 + i / 16) % 1, [cx, cy] = C(zG + 150 * (1 - f)); g.fillStyle = 'rgba(120,85,55,0.9)'; g.beginPath(); g.arc(cx + Math.sin(i * 5) * 14 * k, cy, 1.5 * k, 0, 7); g.fill(); }
  // malla del émbolo (vista a través del vidrio)
  if (pt > 0) {
    const dz = (1 - pt) * 80, zm = zM + dz;
    g.save(); g.globalAlpha *= clamp(pt * 2);
    poli(elipse(zm, rin() - 1), 'rgba(140,145,150,0.55)', tr(4), 1.2 * k);
    const [cx, cy] = C(zm);
    for (let i = -4; i <= 4; i++) { const f = i / 5; linea([cx - A(rin()) * Math.sqrt(1 - f * f) * .95, cy + Bv(rin()) * f], [cx + A(rin()) * Math.sqrt(1 - f * f) * .95, cy + Bv(rin()) * f], 'rgba(242,240,235,0.25)', .7 * k); }
    g.restore();
  }
  // jarra de vidrio y estructura metálica
  g.save(); g.globalAlpha *= clamp(pa * 2);
  poli(silueta(rj, 0, HJ), 'rgba(205,220,230,0.10)', tr(1), 1.4 * k);
  for (const [f, w, al] of [[-.62, 5, .22], [-.48, 2, .35], [.7, 2.5, .15]]) { const [cx, cy0] = C(HJ * .1), [, cy1] = C(HJ * .9); linea([cx + A(RJ) * f, cy0], [cx + A(RJ) * f, cy1], `rgba(255,255,255,${al})`, w * k); }
  for (const a of [-Math.PI * .75, Math.PI * .25]) { const x = (RJ + 2) * Math.cos(a), y = (RJ + 2) * Math.sin(a); linea(P(x, y, 4), P(x, y, HJ - 10), '#7d8186', 4 * k); } // montantes
  const th = -30 * Math.PI / 180, asa = [];                                         // asa
  for (let i = 0; i <= 30; i++) { const s = i / 30, z = HJ - 20 - 95 * s, d = RJ + 2 + 34 * Math.sin(Math.PI * s); asa.push(P(d * Math.cos(th), d * Math.sin(th), z)); }
  for (const [w, c] of [[10, CR], [7.5, '#4a4d51']]) { g.beginPath(); asa.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.lineWidth = w * cam.s; g.strokeStyle = c; g.lineCap = 'round'; g.stroke(); }
  g.restore();
  // tapa, varilla y perilla
  if (pt > 0) {
    const dz = (1 - pt) * 80, zm = zM + dz;
    g.save(); g.globalAlpha *= clamp(pt * 2);
    cilindroMetal(RJ + 2, ZL + dz, ZL + 8 + dz, h(3), k);
    linea(C(zm), C(zm + VAR), '#9a9ea3', 3 * k);                                   // varilla del émbolo
    cilindroMetal(10, zm + VAR, zm + VAR + 16, h(4), k, '#3a3c3f');
    g.restore();
  }
  // tetera (vertido del agua)
  const pk = clamp(Math.min((t - ET[2].t0 + .3) / .5, (ET[3].t0 - t) / .5));
  if (pk > 0) {
    g.save(); g.globalAlpha *= pk;
    const cuello = [[-200, -40, 260], [-160, -30, 236], [-125, -22, 224], [-100, -16, 214], [-88, -13, 205]].map(p => P(...p));
    for (const [w, c] of [[11, tr(2)], [8.5, '#55585b'], [2.5, 'rgba(255,255,255,0.35)']]) { g.beginPath(); cuello.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.lineWidth = w * cam.s; g.strokeStyle = c; g.lineCap = 'round'; g.stroke(); }
    if (t > ET[2].t0 + .1 && t < ET[2].t1 - .3) { const [ax, ay] = cuello[cuello.length - 1], [bx, by] = P(-8, 0, zW + 1);
      g.beginPath(); g.moveTo(ax, ay); g.quadraticCurveTo(ax + 8 * k, (ay + by) / 2, bx, by); g.strokeStyle = 'rgba(205,225,240,0.85)'; g.lineWidth = 2.6 * k; g.lineCap = 'round'; g.stroke(); }
    g.restore();
  }

  const pv = clamp((t - ET[2].t0 - 1) / 1.0) * (1 - clamp((t - ET[3].t0) / .5)) + clamp((t - ET[4].t1) / 1.0);
  if (pv > 0) {

    const zv = pt > .5 ? ZL + 10 : zW;
    [[-14, -8, 0], [8, -18, 1.3], [-24, 10, 2.4]].forEach(([x, y, f]) => {
      g.beginPath();
      for (let i = 0; i <= 30; i++) { const s = i / 30, [px2, py2] = P(x, y, zv + 6 + 60 * s); const ox = Math.sin(s * 7 + t * 2.2 + f) * 6 * cam.s * (0.4 + s); i ? g.lineTo(px2 + ox, py2) : g.moveTo(px2 + ox, py2); }

  g.save(); g.globalAlpha = nv(ET[2].t1 - .5); nivel(izq(122, RJ), '+500 ml', 50); g.restore();
  if (t > ET[3].t0 + .5 && t < ET[4].t0 + .4) { // cronómetro del reposo
    const q = clamp((t - ET[3].t0 - .5) / (ET[3].t1 - ET[3].t0 - .8)), seg = Math.round(240 * (1 - q)), txt = `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, '0')}`;
    g.save(); g.globalAlpha = clamp((t - ET[3].t0 - .5) / .4) * clamp((ET[4].t0 + .4 - t) / .4); rotulo('REPOSO ' + txt, der(HJ - 30, RJ), [60, -70], true); g.restore();
  }
  const E = [
    { e: 1, p: [0, rin() * .5, 10], d: [-90, 40] },
    { e: 2, p: der(70, RJ - 4), d: [90, 30] },
    { e: 3, p: [0, 0, ZL + 8], d: [-100, -40] },
    { e: 4, p: der(zM, rin()), d: [100, 10] },
  ];
  for (const q of E) {
    const a = clamp((t - ET[q.e].t0 - 0.6) / 0.5);
    if (a <= 0) continue;
    g.save(); g.globalAlpha = a; etiqueta(q.e, q.p, q.d, t >= ET[q.e].t0 && t < ET[q.e].t1 + 0.6); g.restore();
  }
}

// ------------------------------------------------------------------ interfaz de plano
const ISO = new Path2D('M 57.574219 52.507812 L 46.25 52.507812 L 51.9375 38.394531 L 53.53125 42.492188 L 56.828125 42.492188 L 53.164062 33.398438 L 50.796875 33.398438 L 41.816406 55.308594 L 45.125 55.304688 L 58.695312 55.304688 L 59.8125 58.101562 L 63.183594 58.101562 L 60.898438 52.464844 Z');
const LOGOTIPO = new Image(); LOGOTIPO.src = 'img/logotipo-averarq-blanco.png';
function isotipo(x, y, h, col) { const s = h / 25.4; g.save(); g.translate(x - 41.6 * s, y - 33 * s); g.scale(s, s); g.fillStyle = col; g.fill(ISO); g.restore(); }
function texto(s, x, y, font, col, al = 'left', a = 1) { g.save(); g.globalAlpha *= a; g.font = font; g.fillStyle = col; g.textAlign = al; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); g.restore(); }

  for (const p of pal) { const prueba = l ? l + ' ' + p : p; if (g.measureText(prueba).width > ancho && l) { texto(l, x, yy, font, col, 'left', a); l = p; yy += alto; } else l = prueba; }

  g.restore();
}
function marco() {
  g.strokeStyle = cr(.5); g.lineWidth = 1.2; g.strokeRect(M, M, W - 2 * M, H - 2 * M - 26);

// ------------------------------------------------------------------ contraportada

  const a = ease((t - T_CP) / 0.8);

function render(t) {
  g.setTransform(SS, 0, 0, SS, 0, 0);
