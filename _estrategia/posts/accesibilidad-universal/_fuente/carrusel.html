<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AVERARQ · Carrusel accesibilidad universal</title>
<link rel="stylesheet" href="../../../animaciones/_fuente/fonts/fonts.css">
<style>html,body{margin:0;background:#111110}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../../_bloques/bloques.js"></script>
<script src="../../_bloques/bloques-dibujo.js"></script>
<script>
/*
  Carrusel «7 requisitos de accesibilidad universal en Chile» (OGUC marzo 2026). 9 láminas 4:5.
  ?slide=1..9 · ?escala=2. Diagramas propios, esquemáticos y sin escala; solo se acotan cifras de la norma.
*/
const Q = new URLSearchParams(location.search), SS = +(Q.get('escala') || 1), SL = +(Q.get('slide') || 1);
const W = 1080, H = 1350;
const cv = document.getElementById('c'), g = cv.getContext('2d'); cv.width = W * SS; cv.height = H * SS;
const OR = '#FC4C02', CR = '#F2F0EB', BG = '#111110', cr = a => `rgba(242,240,235,${a})`, orA = a => `rgba(252,76,2,${a})`, M = 36;
const ISO = new Path2D('M 57.574219 52.507812 L 46.25 52.507812 L 51.9375 38.394531 L 53.53125 42.492188 L 56.828125 42.492188 L 53.164062 33.398438 L 50.796875 33.398438 L 41.816406 55.308594 L 45.125 55.304688 L 58.695312 55.304688 L 59.8125 58.101562 L 63.183594 58.101562 L 60.898438 52.464844 Z');
const carga = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
function isotipo(x, y, h, col) { const s = h / 25.4; g.save(); g.translate(x - 41.6 * s, y - 33 * s); g.scale(s, s); g.fillStyle = col; g.fill(ISO); g.restore(); }
function texto(s, x, y, font, col, al = 'left', base = 'alphabetic') { g.font = font; g.fillStyle = col; g.textAlign = al; g.textBaseline = base; g.fillText(s, x, y); }
function envolver(s, x, y, ancho, font, col, alto) {
  g.font = font; const pal = s.split(' '); let l = '', yy = y;
  for (const p of pal) { const t = l ? l + ' ' + p : p; if (g.measureText(t).width > ancho && l) { texto(l, x, yy, font, col); l = p; yy += alto; } else l = t; }
  if (l) texto(l, x, yy, font, col); return yy;
}
// texto con **destacados** en naranjo, envuelto por palabra
function rico(s, x, y, ancho, tam, alto, col = cr(.88)) {
  const pal = []; s.split('**').forEach((t, i, a) => t.split(' ').forEach((w, j) => w && pal.push([w, i % 2 === 1, j === 0 && i > 0 && t[0] !== ' ' && !a[i - 1].endsWith(' ')])));
  const f = b => b ? `600 ${tam}px Barlow` : `400 ${tam}px Barlow`;
  let cx = x, yy = y, sp0 = 0; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  for (const [w, b, pega] of pal) {
    g.font = f(b); const ww = g.measureText(w).width, sp = g.measureText(' ').width;
    if (pega) cx -= sp0;
    else if (cx + ww > x + ancho && cx > x) { cx = x; yy += alto; }
    g.fillStyle = b ? OR : col; g.fillText(w, cx, yy); cx += ww + sp; sp0 = sp;
  }
  return yy;
}
function patron(fn, s) { const c = document.createElement('canvas'); c.width = c.height = s * SS; const x = c.getContext('2d'); x.scale(SS, SS); fn(x, s); const p = g.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix().scale(1 / SS)); return p; }
let RAYA, PUNTOS;

/* ---------- vistas en metros (y hacia arriba) ---------- */
let V;
function vista(r, mb) {
  const k = Math.min(r[2] / (mb[2] - mb[0]), r[3] / (mb[3] - mb[1]));
  const ox = r[0] + (r[2] - (mb[2] - mb[0]) * k) / 2, oy = r[1] + (r[3] - (mb[3] - mb[1]) * k) / 2;
  V = { k, p: (x, y) => [ox + (x - mb[0]) * k, oy + (mb[3] - y) * k] };
}
const P = (x, y) => V.p(x, y);
function camino(pts, cerrar) { g.beginPath(); pts.forEach(([x, y], i) => { const [X, Y] = P(x, y); i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); if (cerrar) g.closePath(); }
function trazo(pts, col = cr(.9), lw = 2, dash = []) { g.strokeStyle = col; g.lineWidth = lw; g.setLineDash(dash); g.lineCap = 'round'; g.lineJoin = 'round'; camino(pts); g.stroke(); g.setLineDash([]); }
function poli(pts, fill, col, lw = 2) { camino(pts, true); if (fill) { g.fillStyle = fill; g.fill(); } if (col) { g.strokeStyle = col; g.lineWidth = lw; g.stroke(); } }
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function muro(x, y, w, h) { poli(rect(x, y, w, h), RAYA, cr(.85), 1.8); }
function circulo(cx, cy, r, col = OR, lw = 2.5, dash = [12, 8]) { const [X, Y] = P(cx, cy); g.strokeStyle = col; g.lineWidth = lw; g.setLineDash(dash); g.beginPath(); g.arc(X, Y, r * V.k, 0, 7); g.stroke(); g.setLineDash([]); }
function arco(cx, cy, r, a0, a1) { const [X, Y] = P(cx, cy); g.strokeStyle = cr(.55); g.lineWidth = 1.4; g.setLineDash([6, 6]); g.beginPath(); g.arc(X, Y, r * V.k, -a0, -a1, a1 > a0); g.stroke(); g.setLineDash([]); }
function rotulo(s, x, y, al = 'center', col = cr(.7), tam = 15) { const [X, Y] = P(x, y); texto(s, X, Y, `500 ${tam}px "IBM Plex Mono"`, col, al, 'middle'); }
// cota entre a y b (metros) desplazada «off» metros a la derecha del sentido a→b en pantalla
function cota(a, b, off, txt, opt = {}) {
  const [x1, y1] = P(...a), [x2, y2] = P(...b), dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L, o = off * V.k;
  const A = [x1 + nx * o, y1 + ny * o], B = [x2 + nx * o, y2 + ny * o], sg = Math.sign(off) || 1;
  g.strokeStyle = OR; g.lineWidth = 1.5; g.lineCap = 'butt';
  if (off) { g.beginPath(); g.moveTo(x1 + nx * sg * 6, y1 + ny * sg * 6); g.lineTo(A[0] + nx * sg * 8, A[1] + ny * sg * 8); g.moveTo(x2 + nx * sg * 6, y2 + ny * sg * 6); g.lineTo(B[0] + nx * sg * 8, B[1] + ny * sg * 8); g.stroke(); }
  g.beginPath(); g.moveTo(...A); g.lineTo(...B); g.stroke();
  const ux = dx / L, uy = dy / L; g.lineWidth = 2.2;
  for (const [px, py] of [A, B]) { g.beginPath(); g.moveTo(px - (ux + nx) * 6, py - (uy + ny) * 6); g.lineTo(px + (ux + nx) * 6, py + (uy + ny) * 6); g.stroke(); }
  let ang = Math.atan2(dy, dx); if (ang > Math.PI / 2 + .01) ang -= Math.PI; if (ang < -Math.PI / 2 - .01) ang += Math.PI;
  const t = opt.t ?? .5, d = (opt.d ?? 17) * sg, mx = A[0] + (B[0] - A[0]) * t + nx * d, my = A[1] + (B[1] - A[1]) * t + ny * d;
  if (opt.h) { const hx = A[0] + (B[0] - A[0]) * t + nx * sg * 10, hy = A[1] + (B[1] - A[1]) * t + ny * sg * 10; texto(txt, hx, hy, `600 ${opt.tam || 19}px "IBM Plex Mono"`, OR, nx * sg > 0 ? 'left' : 'right', 'middle'); return; }
  g.save(); g.translate(mx, my); g.rotate(ang); texto(txt, 0, 0, `600 ${opt.tam || 19}px "IBM Plex Mono"`, OR, 'center', 'middle'); g.restore();
}
function flecha(pts, col = OR, lw = 3) {
  trazo(pts, col, lw, [14, 9]);
  const [a, b] = [P(...pts[pts.length - 2]), P(...pts[pts.length - 1])], an = Math.atan2(b[1] - a[1], b[0] - a[0]);
  g.fillStyle = col; g.beginPath(); g.moveTo(b[0] + Math.cos(an) * 6, b[1] + Math.sin(an) * 6);
  g.lineTo(b[0] - Math.cos(an - .45) * 18, b[1] - Math.sin(an - .45) * 18); g.lineTo(b[0] - Math.cos(an + .45) * 18, b[1] - Math.sin(an + .45) * 18); g.fill();
}
// silla de ruedas con usuario, vista lateral, mirando a +x; (x, y) = contacto de la rueda grande, girada «ang» rad
function silla(x, y, ang = 0, col = cr(.85)) {
  const c = Math.cos(ang), s = Math.sin(ang), T = (u, v) => [x + u * c - v * s, y + u * s + v * c];
  const L = (...uv) => trazo(uv.map(([u, v]) => T(u, v)), col, 2.6);
  const rueda = (u, v, r) => { const [X, Y] = P(...T(u, v)); g.strokeStyle = col; g.lineWidth = 2.6; g.beginPath(); g.arc(X, Y, r * V.k, 0, 7); g.stroke(); };
  rueda(0, .3, .3); rueda(.5, .07, .07);
  L([-.22, 1.0], [-.12, 1.0], [-.05, .52], [.4, .52], [.48, .14], [.5, .07]); L([.48, .16], [.62, .16]);
  const Lp = (...uv) => trazo(uv.map(([u, v]) => T(u, v)), col, 4.2);
  Lp([.0, .64], [.08, 1.12]); Lp([.0, .64], [.4, .66], [.48, .26], [.6, .26]); Lp([.07, 1.04], [.3, .86]);
  const [X, Y] = P(...T(.13, 1.3)); g.fillStyle = col; g.beginPath(); g.arc(X, Y, .1 * V.k, 0, 7); g.fill();
}

// bloques extraídos de láminas AVERARQ (lámina a 1:50 → 56,7 pt por metro), centrados en (x, y) metros
const PTM = 56.7;
function blq(nom, x, y, rot = 0, opt = {}) {
  const B = caja(BLOQUES[nom], opt.sinAcc), e = (opt.esc || 1) * V.k / PTM, c = Math.abs(Math.cos(rot)), s = Math.abs(Math.sin(rot));
  const w = (B.w * c + B.h * s) * e, h = (B.w * s + B.h * c) * e, [X, Y] = P(x, y);
  bloque(g, nom, X - w / 2, Y - h / 2, w, h, { rot, fondo: BG, ...opt });
}
function isa(x, y, alto, rot = 0, col = OR) { blq('isa', x, y, rot, { esc: alto * PTM / caja(BLOQUES.isa).h, lin: col, acc: col, grosor: 1.4 }); }
// franjas de continuidad de la ruta accesible (como en la planta de accesibilidad)
function franjas(x0, y0, x1, y1, vertical, paso = .7, ancho = .4) {
  const L = vertical ? y1 - y0 : x1 - x0, n = Math.floor((L + paso - ancho) / paso), m = (L - (n - 1) * paso - ancho) / 2;
  for (let i = 0; i < n; i++) {
    const a = (vertical ? y0 : x0) + m + i * paso;
    poli(vertical ? rect(x0, a, x1 - x0, ancho) : rect(a, y0, ancho, y1 - y0), RAYA_OR, OR, 2);
  }
}
let RAYA_OR;

/* ---------- sistema de lámina ---------- */
function marco(logo, n) {
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(242,240,235,0.045)'; g.lineWidth = 1;
  for (let x = M + 30; x < W - M; x += 30) { g.beginPath(); g.moveTo(x, M); g.lineTo(x, H - M - 26); g.stroke(); }
  for (let y = M + 30; y < H - M - 26; y += 30) { g.beginPath(); g.moveTo(M, y); g.lineTo(W - M, y); g.stroke(); }
  g.strokeStyle = cr(.5); g.lineWidth = 1.2; g.strokeRect(M, M, W - 2 * M, H - 2 * M - 26);
  isotipo(M + 30, 62, 34, OR);
  g.drawImage(logo, M + 76, 64, 28 * logo.naturalWidth / logo.naturalHeight, 28);
  texto(`ACCESIBILIDAD UNIVERSAL · ${String(n).padStart(2, '0')}/09`, W - M - 28, 88, '500 17px "IBM Plex Mono"', OR, 'right');
  texto('Diagramas esquemáticos, sin escala.', W / 2, H - 22, '400 15px "IBM Plex Mono"', cr(.5), 'center');
}
function cabecera(num, tit, art) {
  texto(String(num), M + 26, 228, '700 128px "Barlow Condensed"', OR);
  texto(tit, M + 112, 178, '700 58px "Barlow Condensed"', CR);
  texto(art, M + 114, 214, '400 18px "IBM Plex Mono"', cr(.6));
  g.strokeStyle = cr(.5); g.lineWidth = 1.2; g.beginPath(); g.moveTo(M, 246); g.lineTo(W - M, 246); g.stroke();
}
function cifra(y, big, lab1, lab2) {
  g.strokeStyle = cr(.5); g.lineWidth = 1.2; g.beginPath(); g.moveTo(M, y); g.lineTo(W - M, y); g.stroke();
  g.fillStyle = orA(.07); g.fillRect(M, y, W - 2 * M, 130);
  g.font = '700 104px "Barlow Condensed"'; const w = g.measureText(big).width;
  texto(big, M + 28, y + 106, '700 104px "Barlow Condensed"', OR);
  texto(lab1, M + 28 + w + 30, y + 64, '700 34px "Barlow Condensed"', CR);
  if (lab2) texto(lab2, M + 30 + w + 30, y + 98, '400 18px "IBM Plex Mono"', cr(.65));
  g.beginPath(); g.moveTo(M, y + 130); g.lineTo(W - M, y + 130); g.stroke();
}
function vinetas(y, items, tam = 25, alto = 32, sep = 14) {
  for (const s of items) {
    g.fillStyle = OR; g.fillRect(M + 32, y - 13, 10, 10);
    y = rico(s, M + 62, y, W - 2 * M - 92, tam, alto) + alto + sep;
  }
  return y;
}
function pie(art) {
  const y = H - M - 26 - 64;
  g.strokeStyle = cr(.5); g.lineWidth = 1.2; g.beginPath(); g.moveTo(M, y); g.lineTo(W - M, y); g.stroke();
  texto(art, M + 30, y + 40, '400 17px "IBM Plex Mono"', cr(.65));
  texto('AVERARQ.CL', W - M - 28, y + 42, '600 26px "Barlow Condensed"', OR, 'right');
}

/* ---------- baño accesible en planta (portada y lámina 6) ---------- */
function bano(r, cotas) {
  vista(r, cotas ? [-0.75, -1.25, 3.05, 2.85] : [-0.3, -1.05, 2.7, 2.5]);
  const A = 2.4, F = 2.2, e = .15;
  poli(rect(0, 0, A, F), 'rgba(242,240,235,0.03)');
  muro(-e, -e, e, F + 2 * e); muro(A, -e, e, F + 2 * e); muro(0, F, A, e); muro(0, -e, 1.4, e); muro(2.3, -e, .1, e);
  // transferencia lateral 0,80 × 1,20
  poli(rect(.65, 1.0, .8, 1.2), orA(.16), orA(.6), 1.5);
  // inodoro: estanque + taza, eje a 0,40 m
  blq('inodoro', .4, 2.2 - .38, Math.PI / 2, { sinAcc: true, grosor: 1.6 });
  // barras: fija en el muro, abatible junto a la transferencia
  trazo([[.04, 1.25], [.04, 2.1]], OR, 5);
  trazo([[.7, 2.18], [.7, 1.45]], OR, 4, [8, 6]);
  // lavamanos sin pedestal
  poli(rect(1.88, 1.12, .52, .66), BG, cr(.9));
  blq('lavamanos_redondo', 2.16, 1.45, 0, { grosor: 1.4 });
  // puerta 0,90 abriendo hacia afuera
  trazo([[2.3, 0], [2.3, -.9]], cr(.9), 4); arco(2.3, 0, .9, Math.PI, 1.5 * Math.PI);
  circulo(1.5, .85, .75); isa(1.5, .85, .8);
  if (cotas) {
    cota([-.0, 2.35], [.4, 2.35], -.0, '0,40', { d: -18 });
    trazo([[.4, 2.42], [.4, 1.3]], OR, 1.2, [4, 5]);
    cota([.65, 2.06], [1.45, 2.06], 0, '0,80', { d: 16, tam: 16 });
    cota([1.45, 1.0], [1.45, 2.2], 0, '1,20', { d: 18, t: .78, tam: 16 });
    cota([1.4, -.15], [2.3, -.15], .55, '0,90', { d: 18 });
    rotulo('Ø 1,50', 1.5, .22, 'center', OR, 17);
    rotulo('TRANSFERENCIA', 1.05, 1.5, 'center', cr(.85), 11);
    rotulo('BARRA FIJA', -.22, 1.68, 'right', cr(.7), 13);
    rotulo('LAVAMANOS', 2.6, 1.45, 'left', cr(.7), 13);
    rotulo('SIA', 1.85, -.42, 'center', cr(.8), 14);
  } else {
    rotulo('Ø 1,50 m', 1.5, .22, 'center', OR, 18);
  }
}

window.ready = (async () => {
  for (const f of ['400 20px Barlow', '600 20px Barlow', '700 20px "Barlow Condensed"', '600 20px "Barlow Condensed"', '500 20px "IBM Plex Mono"', '600 20px "IBM Plex Mono"', '400 20px "IBM Plex Mono"']) await document.fonts.load(f, 'ÁÉÍÓÚÑáéíóúñ');
  const [logo] = await Promise.all(['../../../animaciones/_fuente/img/logotipo-averarq-blanco.png'].map(carga));
  g.setTransform(SS, 0, 0, SS, 0, 0);
  RAYA = patron((x, s) => { x.fillStyle = 'rgba(242,240,235,0.10)'; x.fillRect(0, 0, s, s); x.strokeStyle = 'rgba(242,240,235,0.38)'; x.lineWidth = 1; x.beginPath(); x.moveTo(0, s); x.lineTo(s, 0); x.moveTo(-1, 1); x.lineTo(1, -1); x.moveTo(s - 1, s + 1); x.lineTo(s + 1, s - 1); x.stroke(); }, 9);
  RAYA_OR = patron((x, s) => { x.fillStyle = 'rgba(252,76,2,0.12)'; x.fillRect(0, 0, s, s); x.strokeStyle = 'rgba(252,76,2,0.9)'; x.lineWidth = 1.3; x.beginPath(); x.moveTo(0, 0); x.lineTo(s, s); x.moveTo(-1, s - 1); x.lineTo(1, s + 1); x.moveTo(s - 1, -1); x.lineTo(s + 1, 1); x.stroke(); }, 8);
  PUNTOS = patron((x, s) => { x.fillStyle = 'rgba(252,76,2,0.18)'; x.fillRect(0, 0, s, s); x.fillStyle = OR; x.beginPath(); x.arc(s / 2, s / 2, 1.9, 0, 7); x.fill(); }, 10);
  marco(logo, SL);

  if (SL === 1) { // portada
    texto('7 REQUISITOS', M + 26, 250, '700 150px "Barlow Condensed"', OR);
    texto('DE ACCESIBILIDAD UNIVERSAL', M + 28, 330, '700 72px "Barlow Condensed"', CR);
    texto('QUE TU PROYECTO DEBE', M + 28, 402, '700 72px "Barlow Condensed"', CR);
    texto('CUMPLIR EN CHILE', M + 28, 474, '700 72px "Barlow Condensed"', CR);
    g.fillStyle = OR; g.fillRect(M + 30, 504, 110, 6);
    texto('Lo que dice la OGUC, no lo que dice internet.', M + 30, 556, '400 30px Barlow', cr(.85));
    bano([M + 60, 600, W - 2 * M - 120, 540], false);
    rotulo('BAÑO ACCESIBLE · PLANTA', 2.65, -.95, 'right', cr(.6), 15);
    pie('OGUC ART. 4.1.7 · VERSIÓN MARZO 2026');
    texto('DESLIZA →', W - M - 28, H - M - 26 - 64 - 24, '600 22px "IBM Plex Mono"', OR, 'right');
  }

  if (SL === 2) { // 1 · ruta accesible
    cabecera(1, 'RUTA ACCESIBLE DESDE LA CALLE', 'OGUC ART. 4.1.7 N°1');
    vista([M + 30, 268, W - 2 * M - 60, 490], [-.3, -.2, 12.3, 9.0]);
    poli(rect(0, 0, 12, 1.5), 'rgba(242,240,235,0.06)', cr(.4), 1.2); rotulo('VEREDA · ESPACIO PÚBLICO', 8.4, .75, 'center', cr(.6));
    trazo([[0, 1.5], [12, 1.5]], cr(.5), 1.4, [10, 6]); rotulo('LÍNEA OFICIAL', 11.9, 1.75, 'right', cr(.5), 13);
    const e = .18;
    muro(2, 4, 1, e); muro(4.2, 4, 6.8, e); muro(2, 4, e, 4.8); muro(10.82, 4, e, 4.8); muro(2, 8.62, 9, e);
    muro(2.18, 5.68, 1.42, .12); muro(4.5, 5.68, 1.6, .12); muro(7.0, 5.68, 1.3, .12); muro(5.0, 5.8, .12, 2.82); muro(8.3, 5.8, .12, 2.82);
    franjas(3.0, 2.05, 4.2, 4.0, true); franjas(4.55, 4.18, 8.42, 5.68, false);
    rotulo('BAÑO', 3.6, 7.3, 'center', cr(.8)); rotulo('ACCESIBLE', 3.6, 6.95, 'center', cr(.8));
    poli(rect(5.6, 6.6, 1.6, 1.6), null, cr(.8), 1.6); trazo([[5.6, 6.6], [7.2, 8.2]], cr(.5), 1); trazo([[7.2, 6.6], [5.6, 8.2]], cr(.5), 1); rotulo('ASCENSOR', 6.4, 6.25, 'center', cr(.8));
    rotulo('ATENCIÓN', 9.3, 6.9, 'center', cr(.8)); rotulo('DE PÚBLICO', 9.3, 6.55, 'center', cr(.8));
    poli(rect(8.9, 4.9, 1.6, .5), null, cr(.7), 1.4);
    for (const [x, y] of [[3.6, .75], [3.6, 4.93]]) { circulo(x, y, .75, OR, 2.2, [9, 6]); isa(x, y, .95); }
    flecha([[3.95, 5.6], [3.95, 6.4]]); flecha([[6.55, 5.6], [6.55, 6.05]]); flecha([[8.42, 5.3], [8.9, 6.0]]);
    blq('sillas_espera', 10.5, 6.95, Math.PI / 2, { grosor: 1.2 });
    blq('inodoro', 2.6, 8.62 - .38, Math.PI / 2, { sinAcc: true, grosor: 1.2 });
    cota([3.0, 1.8], [4.2, 1.8], 0, '1,10', { d: -18, t: -.45 });
    cota([2.6, 4.18], [2.6, 5.68], 0, '1,50', { d: -18 });
    rotulo('RUTA ACCESIBLE', 4.5, 3.0, 'left', OR, 16);
    cifra(776, '1,10 m', 'ANCHO MÍNIMO', 'ALTURA LIBRE MÍNIMA 2,10 m');
    vinetas(950, [
